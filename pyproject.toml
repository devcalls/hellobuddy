[build-system]
requires = [
    "setuptools>=68",
    "wheel"
]
build-backend = "setuptools.build_meta"

[project]
name = "hellobuddy"
version = "1.0.2"
description = "HelloBuddy personal productivity and career assistant"
requires-python = ">=3.11"
dependencies = [
    "serpapi==1.0.2",
    "markdown==3.10.2",
    "mailtrap==2.6.0",
    "requests==2.32.5",
    "pydantic[email]",
    "schedule==1.2.2",
    "pypdf==6.14.2",
    "groq==1.5.0",
    "pydantic-settings==2.14.2",
    "pymupdf==1.28.2",
    "python-docx==1.2.0",
    "google-genai==2.21.0"
]
[project.scripts]
hellobuddy = "app.cli.main:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

# Optional: You can define a dev group for tools you only need while coding
[project.optional-dependencies]
dev = [
    "pytest",
    "ruff"
]